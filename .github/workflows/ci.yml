name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dependencies: [locked, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev \
            libasound2-dev libvulkan1 mesa-vulkan-drivers xvfb
      - name: fmt
        run: cargo fmt --all -- --check
      - name: Update to the newest compatible gpui-kit
        if: matrix.dependencies == 'latest'
        run: cargo update -p gpui-kit
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: tests (under a virtual display)
        run: xvfb-run -a cargo test --locked --all-targets
      - name: build the example
        run: cargo build --locked --example story
